# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

trigger:
- master

pool:
  vmImage: ubuntu-24.04

steps:
- task: Maven@4
  inputs:
    mavenPomFile: 'pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.11'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: true
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    goals: 'package'

- script: |
    echo "=== Listing Root Workspace ==="
    ls -R $(Build.SourcesDirectory)
  displayName: 'Diagnose File Locations'

- task: CopyFiles@2
  displayName: 'Stage WAR file for download'
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/webapp/target'
    Contents: '*.war'  # <--- Changed from 'webapp.war' to a wildcard match
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
- task: PublishBuildArtifacts@1
  inputs:
    SourceFolder: '$(Build.SourcesDirectory)/webapp/target'  # <--- Uses the Linux agent path
    Contents: 'webapp.war'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'